hydra:
  run:
    dir: ${writer.output_dir}

defaults:
  - _self_
  - dataset: openwebtext
  - model: llama_small

from_pretrained: null
resume_from_checkpoint: null

writer:
  project_name: modern-llms
  run_name: test
  output_dir: logs/${writer.project_name}/${writer.run_name}
  mode: offline # "online" | "offline"
  log_assets: false # Upload checkpoints as Comet assets (read by the HF callback)

training_args:
  output_dir: ${writer.output_dir}/checkpoints
  run_name: ${writer.run_name}
  seed: 42
  report_to: comet_ml

  # Schedule: set max_steps > 0 for iteration-based training
  num_train_epochs: 1
  max_steps: -1

  # Batching. The global batch is
  # per_device_train_batch_size * gradient_accumulation_steps * num_devices
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 1
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  dataloader_drop_last: true

  # Optimizer and schedule
  optim: adamw_torch_fused
  learning_rate: 3.0e-4
  adam_beta1: 0.9
  adam_beta2: 0.95
  weight_decay: 0.1
  max_grad_norm: 1.0
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr_rate: 0.1
  warmup_steps: 0.01 # < 1 is a fraction of the total steps, >= 1 a step count

  # Precision and compilation
  bf16: true
  fp16: false
  tf32: true
  torch_compile: true
  torch_compile_mode: null # "default" | "reduce-overhead" | "max-autotune"

  # Logging, evaluation, checkpointing
  logging_steps: 100
  logging_first_step: true
  include_num_input_tokens_seen: true
  eval_strategy: "steps" # "no" | "steps" | "epoch" (needs a non-train dataset partition)
  eval_steps: 3000
  save_strategy: epoch # "no" | "steps" | "epoch"
  save_steps: 1000
  save_total_limit: 1
  load_best_model_at_end: false
  metric_for_best_model: null
  greater_is_better: null

  # Hub.
  push_to_hub: false
  hub_model_id: null
  hub_strategy: every_save
  hub_private_repo: false
